<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top: Quota & Peak Indicator Deck -->
  <rect x="4" y="4.5" width="16" height="6" rx="3" fill="url(#dsh_sl_top)" />
  <circle cx="7.25" cy="7.5" r="1.5" fill="#45D9E7" />
  <circle cx="11.75" cy="7.5" r="1.5" fill="#F2AF63" />
  <rect x="15" y="6.5" width="3.2" height="2" rx="1" fill="#FFFFFF" fill-opacity="0.9" />

  <!-- Top-Right: Luminous Plus (+) Emblem -->
  <path d="M28.5 4.5V11.5M25 8H32" stroke="url(#dsh_sl_plus)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Center: Dynamic Telemetry Pulse Wave (Streaming TPS & Tokens) -->
  <path d="M4 18.5H9.5L13.5 11.5L18 22L22 15.5L24.5 18.5H32" stroke="url(#dsh_sl_wave)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Apex Pulse Beacon -->
  <circle cx="13.5" cy="11.5" r="2.2" fill="#52CED8" />
  <circle cx="13.5" cy="11.5" r="1" fill="#FFFFFF" />

  <!-- Bottom: Statusline Dock Foundation (Git, Context, Costs) -->
  <rect x="4" y="24.5" width="28" height="7" rx="3.5" fill="url(#dsh_sl_dock)" />
  <!-- Terminal Prompt Chevron '>' -->
  <path d="M7.75 26.5L10 28L7.75 29.5" stroke="#45D9E7" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Context Tokens Gauge Segment -->
  <rect x="13" y="26.75" width="9.5" height="2.5" rx="1.25" fill="#FFFFFF" fill-opacity="0.9" />
  <!-- Subagents / Cost Status Dot -->
  <circle cx="27" cy="28" r="1.3" fill="#F2AF63" />

  <defs>
    <linearGradient id="dsh_sl_top" x1="4" y1="4.5" x2="20" y2="10.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B4BD8" />
      <stop offset="1" stop-color="#3B74F2" />
    </linearGradient>
    <linearGradient id="dsh_sl_plus" x1="25" y1="4.5" x2="32" y2="11.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#45D9E7" />
      <stop offset="1" stop-color="#2D5CF5" />
    </linearGradient>
    <linearGradient id="dsh_sl_wave" x1="4" y1="16.75" x2="32" y2="16.75" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="0.35" stop-color="#45D9E7" />
      <stop offset="0.75" stop-color="#4F79F5" />
      <stop offset="1" stop-color="#8057FF" />
    </linearGradient>
    <linearGradient id="dsh_sl_dock" x1="4" y1="24.5" x2="32" y2="31.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1243D6" />
      <stop offset="0.5" stop-color="#2458E8" />
      <stop offset="1" stop-color="#4978F5" />
    </linearGradient>
  </defs>
</svg>
