name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # OIDC trusted publishing: npm authenticates this workflow without a token.
  # npm removes bypass-2FA tokens for direct publishing in January 2027.
  id-token: write

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Use an npm CLI with trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Install project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify
        run: npm run verify:all -- --ui none
      - name: Check tag and published state
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          if npm view "dsh-statusline-plus@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
      - name: Already published
        if: steps.check.outputs.published == 'true'
        run: echo "dsh-statusline-plus@$version is already on npm; nothing to publish."
